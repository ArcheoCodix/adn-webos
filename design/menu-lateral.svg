<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1400" width="1920" height="1400" font-family="Inter, 'DejaVu Sans', sans-serif">
  <title>ADN Android TV — menu latéral (rail de headers Leanback) déployé</title>

  <defs>
    <linearGradient id="railFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#020B11" stop-opacity="1"/>
      <stop offset="1" stop-color="#020B11" stop-opacity="0"/>
    </linearGradient>

    <!-- Carte série : image 245x350 + bandeau info 104 (lb_basic_card_info_height 52dp) -->
    <g id="showCard">
      <rect width="245" height="454" rx="4" fill="#303132"/>
      <rect width="245" height="350" fill="#0C2330"/>
      <path d="M0 265 L62 198 L124 262 L172 218 L245 292 L245 350 L0 350 Z" fill="#273D49"/>
      <circle cx="188" cy="72" r="27" fill="#273D49"/>
      <rect x="14" y="368" width="176" height="16" rx="3" fill="#DDDDDD"/>
      <rect x="14" y="398" width="104" height="12" rx="3" fill="#999999"/>
    </g>

    <g id="showCardFocus">
      <rect width="245" height="454" rx="4" fill="#0096FF"/>
      <rect width="245" height="350" fill="#0C2330"/>
      <path d="M0 265 L62 198 L124 262 L172 218 L245 292 L245 350 L0 350 Z" fill="#273D49"/>
      <circle cx="188" cy="72" r="27" fill="#273D49"/>
      <rect x="14" y="368" width="176" height="16" rx="3" fill="#FFFFFF"/>
      <rect x="14" y="398" width="104" height="12" rx="3" fill="#CBD8E0"/>
    </g>
  </defs>

  <!-- ===================== ÉCRAN 1920x1080 ===================== -->
  <g>
    <rect width="1920" height="1080" fill="#04121A"/>

    <!-- Rows en arrière-plan, décalées à droite quand le rail est déployé -->
    <!-- lb_browse_rows_margin_start 238dp = 476px ; rows_margin_top 167dp = 334px -->
    <g>
      <text x="560" y="300" fill="#FFFFFF" font-size="40" font-weight="600">Simulcast</text>
      <use href="#showCardFocus" x="560" y="334"/>
      <use href="#showCard" x="821" y="334"/>
      <use href="#showCard" x="1082" y="334"/>
      <use href="#showCard" x="1343" y="334"/>
      <use href="#showCard" x="1604" y="334"/>
      <use href="#showCard" x="1865" y="334"/>

      <text x="560" y="880" fill="#999999" font-size="40" font-weight="600">Reprendre la lecture</text>
      <g>
        <rect x="560" y="914" width="400" height="225" fill="#0C2330"/>
        <rect x="560" y="1131" width="400" height="8" fill="#FFFFFF" opacity="0.25"/>
        <rect x="560" y="1131" width="164" height="8" fill="#0096FF"/>
        <rect x="976" y="914" width="400" height="225" fill="#0C2330"/>
        <rect x="1392" y="914" width="400" height="225" fill="#0C2330"/>
      </g>
    </g>

    <!-- Rail de headers : dock large de 270dp + paddingEnd 50dp -->
    <g>
      <rect x="0" y="0" width="540" height="1080" fill="#020B11"/>
      <!-- fading edge, lb_browse_header_fading_length 12dp = 24px -->
      <rect x="516" y="0" width="24" height="1080" fill="url(#railFade)"/>

      <!-- Items de header. Hauteur 24dp=48px, espacement vertical 21dp=42px, texte 20sp=40px -->
      <g font-size="40">
        <!-- sélectionné : blanc + barre d'accent -->
        <rect x="88" y="330" width="6" height="48" fill="#0096FF"/>
        <text x="112" y="368" fill="#FFFFFF" font-weight="700">Simulcast</text>

        <text x="112" y="458" fill="#999999">Reprendre la lecture</text>
        <text x="112" y="548" fill="#999999">Watchlist</text>
        <text x="112" y="638" fill="#999999">Tendances</text>
        <text x="112" y="728" fill="#999999">Nouveaux épisodes</text>
        <text x="112" y="818" fill="#999999">Films</text>
        <text x="112" y="908" fill="#999999">Configuration</text>
      </g>
    </g>

    <!-- Barre de titre : orbe à gauche (START), badge à droite (END) -->
    <!-- lb_browse_padding_start 56dp = 112px ; padding_top 27dp = 54px ; orbe 52dp = 104px -->
    <g>
      <circle cx="164" cy="114" r="52" fill="#0096FF"/>
      <g stroke="#FFFFFF" stroke-width="6" fill="none" stroke-linecap="round">
        <circle cx="158" cy="108" r="18"/>
        <line x1="171" y1="121" x2="182" y2="132"/>
      </g>

      <g text-anchor="end">
        <text x="1808" y="128" fill="#0096FF" font-size="72" font-weight="700" letter-spacing="2">adn</text>
        <text x="1808" y="158" fill="#5E717B" font-size="18" letter-spacing="3">ANIMATION DIGITAL NETWORK</text>
      </g>
    </g>

    <!-- Cotes -->
    <g stroke="#36DFFA" stroke-width="2" fill="none" stroke-dasharray="8 6" opacity="0.9">
      <line x1="0" y1="1010" x2="540" y2="1010"/>
      <line x1="0" y1="998" x2="0" y2="1022"/>
      <line x1="540" y1="998" x2="540" y2="1022"/>
      <line x1="560" y1="216" x2="560" y2="272"/>
      <line x1="560" y1="216" x2="900" y2="216"/>
    </g>
    <g fill="#36DFFA" font-size="24">
      <text x="270" y="1000" text-anchor="middle">rail 270dp (540px)</text>
      <text x="912" y="224">les rows sont décalées à droite du rail (rows_margin_start 238dp)</text>
    </g>
  </g>

  <!-- ===================== LÉGENDE ===================== -->
  <g transform="translate(0,1080)">
    <rect width="1920" height="320" fill="#020B11"/>
    <line x1="0" y1="0" x2="1920" y2="0" stroke="#273D49" stroke-width="2"/>

    <text x="112" y="56" fill="#FFFFFF" font-size="30" font-weight="700">Menu latéral — rail de headers de BrowseSupportFragment (aucun burger, aucune tab bar)</text>

    <g font-size="24" fill="#CBD8E0">
      <text x="112" y="110">État déployé : le focus est dans le rail, les rows sont décalées à droite et rognées.</text>
      <text x="112" y="148">← depuis la première carte d'une row ramène le focus au rail. Back ne le rouvre pas (headersBackStackEnabled = false).</text>
      <text x="112" y="186">Un header par row : titre venant de l'API pour les catégories, plus « Watchlist » et « Configuration » ajoutés par le client.</text>
    </g>

    <g font-size="22">
      <text x="112" y="248" fill="#78C8FF" font-weight="600">Couleurs</text>
      <rect x="112" y="266" width="28" height="28" fill="#020B11" stroke="#273D49"/>
      <text x="152" y="288" fill="#999999">#020B11 rail (brandColor)</text>
      <rect x="470" y="266" width="28" height="28" fill="#04121A" stroke="#273D49"/>
      <text x="510" y="288" fill="#999999">#04121A fond des rows</text>
      <rect x="830" y="266" width="28" height="28" fill="#0096FF"/>
      <text x="870" y="288" fill="#999999">#0096FF accent, focus, orbe</text>

      <text x="1280" y="248" fill="#78C8FF" font-weight="600">Échelle</text>
      <text x="1280" y="288" fill="#999999">1080p = xhdpi, donc dp × 2 en px</text>
    </g>
  </g>
</svg>
